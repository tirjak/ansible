[rke2_cluster]
# First host becomes the control plane (server)
# Subsequent hosts become worker nodes (agents)

# Example with 3 nodes (1 control plane + 2 workers):
rke2-control-1 ansible_host=10.0.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/github/ec2.pem
rke2-worker-1 ansible_host=10.0.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/github/ec2.pem
rke2-worker-2 ansible_host=10.0.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/github/ec2.pem

# Scale up by adding more worker nodes:
# rke2-worker-3 ansible_host=10.0.1.13 ansible_user=ubuntu ansible_ssh_private_key_file=~/github/ec2.pem
# rke2-worker-4 ansible_host=10.0.1.14 ansible_user=ubuntu ansible_ssh_private_key_file=~/github/ec2.pem

[rke2_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
rke2_token=your-secret-token-here

# [local]
# localhost ansible_connection=local
