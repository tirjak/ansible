---
- name: Wait for control plane API to be ready
  shell: |
    curl -sk https://{{ rke2_control_plane_ip }}:6443/healthz
  retries: 60
  delay: 10
  changed_when: false
  register: cp_ready
  until: cp_ready.rc == 0

- name: Ensure RKE2 config directory exists
  file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: '0755'

- name: Generate RKE2 agent config
  template:
    src: config.yaml.j2
    dest: "{{ rke2_config_dir }}/config.yaml"
    mode: '0644'

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable and start RKE2 agent service
  systemd:
    name: "{{ rke2_agent_service_name }}"
    enabled: yes
    state: started

- name: Wait for RKE2 agent to bootstrap and join cluster
  shell: |
    until sudo /var/lib/rancher/rke2/bin/kubectl --kubeconfig /var/lib/rancher/rke2/agent/kubelet.kubeconfig get nodes &>/dev/null 2>&1 || sudo systemctl is-active rke2-agent &>/dev/null; do
      echo "Waiting for agent to join..."
      sleep 5
    done
  retries: 60
  delay: 5
  changed_when: false
  register: agent_ready
  until: agent_ready.rc == 0

- name: Verify agent node is registered
  shell: |
    export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
    /var/lib/rancher/rke2/bin/kubectl get nodes --kubeconfig /etc/rancher/rke2/rke2.yaml 2>/dev/null || echo "API not accessible from agent"
  changed_when: false
  ignore_errors: yes

- name: Display agent join status
  debug:
    msg: "Agent {{ inventory_hostname }} configuration complete - joining cluster"
