[defaults]
# Inventory
inventory = inventory.ini

# SSH Configuration
host_key_checking = True
# Automatically add new host keys (via pre-task instead)
# ssh_args allows for better SSH connection handling
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

# Connection settings
timeout = 30
connect_timeout = 10

# Privilege escalation
become_method = sudo

# Display and output
force_color = True
display_skipped_hosts = False
display_ok_hosts = True

# Parallel execution
forks = 5

# Logging
log_path = /tmp/ansible.log

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
